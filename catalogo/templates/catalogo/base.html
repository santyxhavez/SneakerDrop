<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SneakerDrop{% endblock %}</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; color: #212529; }
        nav { background: #000; padding: 20px; text-align: center; }
        nav a { color: #fff; margin: 0 20px; text-decoration: none; font-size: 1.2em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
        nav a:hover { color: #ff6b6b; }
        .container { padding: 40px; max-width: 1100px; margin: auto; }
        .btn { background: #ff4757; color: #fff; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; transition: 0.3s; text-align: center;}
        .btn:hover { background: #000; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">🔥 SneakerDrop</a>
        <a href="/admin">⚙️ Panel Admin</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
